<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Department Proof | The Fourth & Fuckup Tribune</title><link rel="stylesheet" href="style.css"><style>body{background:#dfcda5;color:#251b12}.proof-paper{max-width:1150px;margin:28px auto;padding:clamp(18px,4vw,55px);background:#f4e6c6;border:5px double #4b3824;box-shadow:0 8px 35px #59442a44}.proof-head{text-align:center;border-bottom:5px double #4b3824;padding-bottom:20px}.proof-head h1{font-family:Georgia,serif;font-size:clamp(30px,5vw,64px);margin:10px 0}.proof-article{padding:28px 0;border-bottom:2px solid #8e785a}.proof-article h2{font-family:Georgia,serif;font-size:clamp(26px,4vw,46px);line-height:1.12}.proof-article img{display:block;max-width:100%;max-height:520px;object-fit:contain;margin:22px auto}.proof-article .story{font-family:Georgia,serif;font-size:20px;line-height:1.6;white-space:pre-wrap}.proof-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:30px}.proof-grid .proof-article h2{font-size:30px}.proof-label{font:700 12px Arial,sans-serif;letter-spacing:.17em;color:#863324}.proof-nav{display:flex;gap:16px;justify-content:space-between;flex-wrap:wrap}</style></head><body><main class="proof-paper"><nav class="proof-nav"><a href="edition-manager.html">← BACK TO EDITION MANAGER</a><span class="proof-label">PRIVATE EDITORIAL PROOF · NOT PUBLISHED</span></nav><header class="proof-head"><p class="proof-label">THE FOURTH & FUCKUP TRIBUNE</p><h1 id="department-title">Department proof</h1><p>CONFIDENTIAL NEWSPAPER LAYOUT · SAVED ARTICLE DRAFTS</p></header><section id="lead"></section><section id="support" class="proof-grid"></section><p id="notice" role="status"></p><footer style="text-align:center;padding:30px 0">END OF PRIVATE PROOF · NO PUBLIC CONTENT CHANGED</footer></main><script>
'use strict';
(()=>{
const names={summit:'WESTFORT DYNASTY',chafe:'SLEEPING GIANT',bench:'BENCHWARMER BULLETIN',frank:"FRANK'S DESK",shame:'WALL OF SHAME'};
let payload=null;try{payload=JSON.parse(sessionStorage.getItem('tribune-private-department-proof')||'null')}catch{}
if(!payload||!names[payload.department]||!Array.isArray(payload.articles)||!payload.articles.length){document.getElementById('notice').textContent='No private department proof is available in this tab. Open a saved draft proof from Edition Manager first.';return;}
document.getElementById('department-title').textContent=names[payload.department];
function addArticle(a,container,label){const article=document.createElement('article');article.className='proof-article';const tag=document.createElement('p');tag.className='proof-label';tag.textContent=label;const h=document.createElement('h2');h.textContent=a.headline||'Untitled';const by=document.createElement('p');by.textContent='BY '+(a.author||'TRIBUNE STAFF');const summary=document.createElement('p');summary.style.fontWeight='bold';summary.textContent=a.summary||'';article.append(tag,h,by);if(typeof a.image==='string'&&a.image.startsWith('data:image/')){const img=document.createElement('img');img.src=a.image;img.alt='Illustration for '+(a.headline||'article');article.append(img);}article.append(summary);const story=document.createElement('div');story.className='story';story.textContent=a.story||'';article.append(story);container.append(article);}
payload.articles.forEach((a,i)=>addArticle(a,document.getElementById(i?'support':'lead'),i?'SUPPORTING STORY '+i:'FEATURED ARTICLE'));
})();
</script></body></html>
