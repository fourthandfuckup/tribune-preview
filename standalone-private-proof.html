<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Private Standalone Article Proof | Tribune</title><link rel="stylesheet" href="style.css"><style>main{max-width:850px;margin:30px auto;padding:24px;background:#f4e7c9;color:#282116;border:3px double #51402a}.private{letter-spacing:.15em;text-transform:uppercase;font-size:.75rem;font-weight:bold}.story-text{white-space:pre-wrap;line-height:1.7;font-size:1.08rem}.headline{font:700 clamp(2rem,5vw,3.7rem)/1.08 Georgia,serif}.summary{font-weight:bold;font-size:1.2rem}</style></head><body><main><p class="private">Frank's Office · Confidential Editorial Proof · Not Published</p><p><a href="article-editor.html">← Return to Article Editor</a></p><article id="proof"></article><p class="private">Browser-session preview only · No public publication</p></main><script>
'use strict';
const root=document.getElementById('proof');let data=null;try{data=JSON.parse(sessionStorage.getItem('tribune-preview-standalone-private-proof')||'null')}catch{}
if(!data){root.textContent='No private proof is available in this browser session. Open a proof from the Article Editor.';}
else{
function add(tag,content,cls){const node=document.createElement(tag);node.textContent=content||'';if(cls)node.className=cls;root.append(node);return node;}
add('p',(data.categories||[]).join(' · '),'private');add('h1',data.headline,'headline');add('p','By '+(data.author||'Tribune Staff'));add('p',data.summary,'summary');add('div',data.story,'story-text');
}
</script></body></html>
