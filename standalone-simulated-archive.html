<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Simulated Standalone Archive | Tribune Preview</title><link rel="stylesheet" href="style.css"><style>main{max-width:950px;margin:28px auto;padding:24px;background:#f4e7c9;color:#282116}.story{white-space:pre-wrap;line-height:1.65}article{padding:20px 0;border-bottom:3px double #51402a}h2{font:700 clamp(1.6rem,4vw,2.8rem)/1.1 Georgia,serif}</style></head><body><main><p><a href="article-editor.html">← Article Editor</a> · <a href="index.html">Preview Newspaper</a></p><h1>STANDALONE PUBLICATION — SIMULATION ONLY</h1><p><strong>Nothing on this page is publicly published.</strong> This archive exists only in your browser's local storage and is not accessible to other readers.</p><div id="stories"></div><button id="clear" type="button">CLEAR SIMULATED PUBLICATIONS</button></main><script>
'use strict';
const key='tribune-preview-standalone-simulated-publications',root=document.getElementById('stories');
function render(){root.replaceChildren();let items=[];try{items=JSON.parse(localStorage.getItem(key)||'[]')}catch{}if(!items.length){root.textContent='No simulated publications yet.';return;}
for(const item of items){const a=document.createElement('article');function add(tag,value,cls){const el=document.createElement(tag);el.textContent=value||'';if(cls)el.className=cls;a.append(el);}add('p',(item.categories||[]).join(' · '));add('h2',item.headline);add('p','By '+(item.author||'Tribune Staff'));add('p',item.summary);add('div',item.story,'story');add('p','Simulated on '+new Date(item.simulatedAt).toLocaleString());root.append(a);}}
document.getElementById('clear').onclick=()=>{if(!confirm('Clear browser-only simulated publications?'))return;localStorage.removeItem(key);render();};render();
</script></body></html>
